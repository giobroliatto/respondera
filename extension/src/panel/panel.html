<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Respondera</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <div id="panel">

    <!-- Header -->
    <div class="panel-header">
      <span class="panel-title"><svg width="14" height="14" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M 26.6875 12.6602 C 26.9687 12.6602 27.1094 12.4961 27.1797 12.2383 C 27.9062 8.3242 27.8594 8.2305 31.9375 7.4570 C 32.2187 7.4102 32.3828 7.2461 32.3828 6.9648 C 32.3828 6.6836 32.2187 6.5195 31.9375 6.4726 C 27.8828 5.6524 28.0000 5.5586 27.1797 1.6914 C 27.1094 1.4336 26.9687 1.2695 26.6875 1.2695 C 26.4062 1.2695 26.2656 1.4336 26.1953 1.6914 C 25.3750 5.5586 25.5156 5.6524 21.4375 6.4726 C 21.1797 6.5195 20.9922 6.6836 20.9922 6.9648 C 20.9922 7.2461 21.1797 7.4102 21.4375 7.4570 C 25.5156 8.2774 25.4687 8.3242 26.1953 12.2383 C 26.2656 12.4961 26.4062 12.6602 26.6875 12.6602 Z M 15.3438 28.7852 C 15.7891 28.7852 16.0938 28.5039 16.1406 28.0821 C 16.9844 21.8242 17.1953 21.8242 23.6641 20.5821 C 24.0860 20.5117 24.3906 20.2305 24.3906 19.7852 C 24.3906 19.3633 24.0860 19.0586 23.6641 18.9883 C 17.1953 18.0977 16.9609 17.8867 16.1406 11.5117 C 16.0938 11.0899 15.7891 10.7852 15.3438 10.7852 C 14.9219 10.7852 14.6172 11.0899 14.5703 11.5352 C 13.7969 17.8164 13.4687 17.7930 7.0469 18.9883 C 6.6250 19.0821 6.3203 19.3633 6.3203 19.7852 C 6.3203 20.2539 6.6250 20.5117 7.1406 20.5821 C 13.5156 21.6133 13.7969 21.7774 14.5703 28.0352 C 14.6172 28.5039 14.9219 28.7852 15.3438 28.7852 Z M 31.2344 54.7305 C 31.8438 54.7305 32.2891 54.2852 32.4062 53.6524 C 34.0703 40.8086 35.8750 38.8633 48.5781 37.4570 C 49.2344 37.3867 49.6797 36.8945 49.6797 36.2852 C 49.6797 35.6758 49.2344 35.2070 48.5781 35.1133 C 35.8750 33.7070 34.0703 31.7617 32.4062 18.9180 C 32.2891 18.2852 31.8438 17.8633 31.2344 17.8633 C 30.6250 17.8633 30.1797 18.2852 30.0860 18.9180 C 28.4219 31.7617 26.5938 33.7070 13.9140 35.1133 C 13.2344 35.2070 12.7891 35.6758 12.7891 36.2852 C 12.7891 36.8945 13.2344 37.3867 13.9140 37.4570 C 26.5703 39.1211 28.3281 40.8321 30.0860 53.6524 C 30.1797 54.2852 30.6250 54.7305 31.2344 54.7305 Z" fill="currentColor"/></svg>Respond<span class="title-accent">era</span></span>
      <button id="btn-close" class="btn-close" type="button" aria-label="Fechar painel" title="Fechar">✕</button>
    </div>

    <!-- Avaliação (readonly) -->
    <div id="review-section" class="panel-section review-section">
      <div class="review-meta">
        <span id="reviewer-name" class="reviewer-name"></span>
        <span id="rating-stars" class="rating-stars"></span>
      </div>
      <p id="review-text" class="review-text"></p>
    </div>

    <!-- Seletor de tom -->
    <div class="panel-section" id="tone-section">
      <span class="section-label">Tom da resposta</span>
      <!-- Linha 1 (FREE + PRO): Amigável | Formal | Empático -->
      <div class="tone-group" role="group" aria-label="Selecionar tom da resposta" id="tone-group-base">
        <button class="tone-btn active" data-tone="friendly" type="button">Amigável</button>
        <button class="tone-btn" data-tone="formal" type="button">Formal</button>
        <button class="tone-btn" data-tone="empathetic" type="button">Empático</button>
      </div>
      <!-- Linha 2 (PRO): Direto | Descontraído | Assertivo -->
      <div class="tone-group tone-group-pro hidden" role="group" id="tone-group-pro" aria-label="Tons exclusivos PRO">
        <button class="tone-btn tone-btn-pro" data-tone="direct" type="button">Direto</button>
        <button class="tone-btn tone-btn-pro" data-tone="casual" type="button">Descontraído</button>
        <button class="tone-btn tone-btn-pro" data-tone="assertive" type="button">Assertivo</button>
      </div>
      <!-- Tom personalizado toggle (PRO) -->
      <div class="custom-tone-row hidden" id="custom-tone-row">
        <button class="tone-custom-toggle" id="btn-custom-tone" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20.9888 4.28491L19.6405 2.93089C18.4045 1.6897 16.4944 1.6897 15.2584 2.93089L13.0112 5.30042L18.7416 11.055L21.1011 8.68547C21.6629 8.1213 22 7.33145 22 6.54161C22 5.75176 21.5506 4.84908 20.9888 4.28491Z" fill="currentColor"/><path d="M16.2697 10.9422L11.7753 6.42877L2.89888 15.3427C2.33708 15.9069 2 16.6968 2 17.5994V21.0973C2 21.5487 2.33708 22 2.89888 22H6.49438C7.2809 22 8.06742 21.6615 8.74157 21.0973L17.618 12.1834L16.2697 10.9422Z" fill="currentColor"/></svg>
          Personalizar tom
        </button>
        <div class="custom-tone-input-wrap hidden" id="custom-tone-input-wrap">
          <input
            type="text"
            id="custom-tone-input"
            class="custom-tone-input"
            placeholder="Descreva o tom que quiser. Ex: irônico, ultra-formal, jurídico..."
            maxlength="100"
          />
          <span class="rg-char-count" id="custom-tone-char-count">0/100</span>
        </div>
      </div>
      <!-- Mensagem inline para usuário FREE tentando usar tom PRO -->
      <p class="pro-required-msg hidden" id="pro-required-msg">Disponível no plano PRO</p>
    </div>

    <!-- Contexto adicional (PRO) -->
    <div class="panel-section">
      <div class="rg-field-group">
        <label for="rg-additional-context" class="rg-field-label">Contexto adicional <span class="rg-optional">(opcional)</span></label>
        <textarea
          id="rg-additional-context"
          class="rg-context-textarea"
          placeholder="Ex: esse cliente nunca esteve aqui / já resolvemos isso diretamente / o funcionário mencionado foi desligado"
          rows="2"
          maxlength="300"
        ></textarea>
        <span class="rg-char-count" id="rg-char-count">0/300</span>
        <p class="pro-required-msg hidden" id="context-pro-msg">Disponível no plano PRO</p>
      </div>
    </div>

    <!-- Área dinâmica: cresce para preencher o espaço -->
    <div class="panel-main">

      <!-- Resposta gerada -->
      <div id="reply-section" class="hidden">
        <span class="section-label">Resposta gerada</span>
        <textarea id="reply-textarea" aria-label="Resposta gerada" spellcheck="true"></textarea>
      </div>

      <!-- Carregando -->
      <div id="loading-section" class="state-section hidden">
        <span class="spinner" aria-hidden="true"></span>
        <span>Gerando resposta...</span>
      </div>

      <!-- Erro -->
      <div id="error-section" class="state-section hidden">
        <p id="error-message" class="error-msg" role="alert"></p>
      </div>

      <!-- Não logado -->
      <div id="not-logged-section" class="state-section hidden">
        <p class="not-logged-msg">Você precisa fazer login para usar o Respondera.</p>
        <p class="not-logged-hint">Clique no ícone da extensão na barra do Chrome para entrar.</p>
        <button id="btn-recheck-auth" class="btn-secondary" type="button">Já fiz login — verificar</button>
      </div>

      <!-- Limite atingido -->
      <div id="limit-section" class="state-section hidden">
        <p class="limit-msg">⚠ Você atingiu o limite de respostas deste mês.</p>
      </div>

    </div><!-- /panel-main -->

    <!-- Ações -->
    <div class="panel-actions">
      <button id="btn-generate" class="btn-primary" type="button">Gerar resposta</button>
      <button id="btn-regenerate" class="btn-secondary hidden" type="button">↺ Regenerar</button>
      <button id="btn-use" class="btn-success hidden" type="button">✓ Usar esta resposta</button>
    </div>

    <!-- Footer -->
    <div class="panel-footer">
      <span id="usage-info" class="usage-info"></span>
    </div>

  </div>
  <script src="panel.js"></script>
</body>
</html>
