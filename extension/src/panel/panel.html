<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Respondera</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <div id="panel">

    <!-- Loading overlay (esconde até RESPONDERA_DATA chegar) -->
    <div id="panel-loading" class="panel-loading">
      <div class="panel-spinner"></div>
    </div>

    <!-- Header -->
    <div class="panel-header">
      <span class="panel-title"><img src="icons/icon512.png" alt="Respondera" class="panel-logo">Respond<span class="title-accent">era</span></span>
      <button id="btn-close" class="btn-close" type="button" aria-label="Fechar painel" title="Fechar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>

    <!-- Área com scroll único (tudo exceto header e ações) -->
    <div class="panel-scroll">

    <!-- Avaliação (readonly) -->
    <div id="review-section" class="panel-section review-section">
      <div class="review-meta">
        <span id="reviewer-name" class="reviewer-name"></span>
        <span id="rating-stars" class="rating-stars"></span>
      </div>
      <p id="review-text" class="review-text"></p>
    </div>

    <!-- Seletor de tom -->
    <div class="panel-section" id="tone-section">
      <span class="section-label">Tom da resposta</span>
      <!-- Linha 1 (FREE + PRO): Amigável | Formal | Empático -->
      <div class="tone-group" role="group" aria-label="Selecionar tom da resposta" id="tone-group-base">
        <button class="tone-btn active" data-tone="friendly" type="button" data-tooltip="Tom leve e caloroso. Ótimo para a maioria das avaliações.">Amigável</button>
        <button class="tone-btn" data-tone="formal" type="button" data-tooltip="Linguagem respeitosa e profissional. Trata o cliente por &quot;Você&quot;.">Formal</button>
        <button class="tone-btn" data-tone="empathetic" type="button" data-tooltip="Prioriza acolhimento. Ideal para reclamações genuínas.">Empático</button>
      </div>
      <!-- Linha 2 (PRO): Direto | Descontraído | Assertivo -->
      <div class="tone-group tone-group-pro" role="group" id="tone-group-pro" aria-label="Tons exclusivos PRO">
        <button class="tone-btn tone-btn-pro" data-tone="direct" type="button" data-tooltip="Objetivo e conciso. Respostas mais curtas que o normal.">Direto</button>
        <button class="tone-btn tone-btn-pro" data-tone="casual" type="button" data-tooltip="Informal e próximo. Ótimo para negócios jovens e modernos.">Descontraído</button>
        <button class="tone-btn tone-btn-pro" data-tone="assertive" type="button" data-tooltip="Firme e profissional. Para avaliações de má-fé ou agressivas.">Assertivo</button>
      </div>
      <!-- Meus tons — tons personalizados salvos (PRO) -->
      <div class="saved-tones-section" id="saved-tones-section">
        <div class="saved-tones-header">
          <span class="saved-tones-label">Meus tons</span>
          <button class="btn-add-tone" id="btn-add-tone" type="button">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Criar tom
          </button>
        </div>
        <div class="saved-tones-list" id="saved-tones-list"></div>
        <div class="tone-create-form hidden" id="tone-create-form">
          <input type="text" id="tone-create-name" class="tone-create-input" placeholder='Nome (ex: "Tom do Restaurante")' maxlength="30" />
          <textarea id="tone-create-desc" class="tone-create-textarea" placeholder="Como você quer que seja? Ex: usa humor leve, menciona o ambiente acolhedor, sempre agradece pela visita..." maxlength="200" rows="3"></textarea>
          <div class="tone-create-chips" id="tone-create-chips">
            <button type="button" class="tone-chip-example" data-desc="Irônico e sarcástico, mas sempre elegante e sem ser grosseiro">Irônico</button>
            <button type="button" class="tone-chip-example" data-desc="Ultra-formal e impessoal, como uma nota oficial de empresa">Ultra-formal</button>
            <button type="button" class="tone-chip-example" data-desc="Bem-humorado e descontraído, como se um amigo estivesse respondendo">Informal</button>
            <button type="button" class="tone-chip-example" data-desc="Muito breve e direto, no máximo 2 frases, sem florear">Minimalista</button>
          </div>
          <div class="tone-create-actions">
            <button type="button" id="btn-tone-cancel" class="btn-tone-cancel">Cancelar</button>
            <button type="button" id="btn-tone-save" class="btn-tone-save">Salvar tom</button>
          </div>
        </div>
      </div>
      <!-- Mensagem inline para usuário FREE tentando usar tom PRO -->
      <p class="pro-required-msg hidden" id="pro-required-msg">Disponível no plano PRO</p>
    </div>

    <!-- Contexto adicional (PRO) -->
    <div class="panel-section">
      <div class="rg-field-group">
        <label for="rg-additional-context" class="rg-field-label">Contexto adicional <span class="rg-optional">(opcional)</span></label>
        <textarea
          id="rg-additional-context"
          class="rg-context-textarea"
          placeholder="Ex: tive um problema de saúde / já resolvemos isso diretamente / o funcionário mencionado foi desligado"
          rows="2"
          maxlength="300"
        ></textarea>
        <span class="rg-char-count" id="rg-char-count">0/300</span>
        <p class="pro-required-msg hidden" id="context-pro-msg">Disponível no plano PRO</p>
      </div>
    </div>

    <!-- Área dinâmica: cresce para preencher o espaço -->
    <div class="panel-main">

      <!-- Resposta gerada -->
      <div id="reply-section" class="hidden">
        <span class="section-label">Resposta gerada</span>
        <textarea id="reply-textarea" aria-label="Resposta gerada" spellcheck="true"></textarea>
        <p id="context-warning-msg" class="context-warning hidden"></p>
      </div>

      <!-- Carregando -->
      <div id="loading-section" class="state-section hidden">
        <span class="spinner" aria-hidden="true"></span>
        <span>Gerando resposta...</span>
      </div>

      <!-- Erro -->
      <div id="error-section" class="state-section hidden">
        <p id="error-message" class="error-msg" role="alert"></p>
      </div>

      <!-- Não logado -->
      <div id="not-logged-section" class="state-section hidden">
        <p class="not-logged-msg">Você precisa fazer login para usar o Respondera.</p>
        <p class="not-logged-hint">Clique no ícone da extensão na barra do Chrome para entrar.</p>
        <button id="btn-recheck-auth" class="btn-secondary" type="button">Já fiz login — verificar</button>
      </div>

      <!-- Limite atingido -->
      <div id="limit-section" class="state-section hidden">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <p class="limit-msg">Você atingiu o limite de respostas deste mês.</p>
      </div>

    </div><!-- /panel-main -->

    </div><!-- /panel-scroll -->

    <!-- Footer (fixo) -->
    <div class="panel-footer">
      <span id="usage-info" class="usage-info"></span>
    </div>

    <!-- Ações (fixas) -->
    <div class="panel-actions">
      <button id="btn-generate" class="btn-primary" type="button">Gerar resposta</button>
      <button id="btn-regenerate" class="btn-secondary hidden" type="button"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.9"/></svg> Regenerar</button>
      <button id="btn-use" class="btn-success hidden" type="button"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Usar esta resposta</button>
    </div>

  </div>
  <script src="panel.js"></script>
</body>
</html>
