services:
  postgres:
    image: postgres:16-alpine
    container_name: respondera_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: respondera
      POSTGRES_PASSWORD: respondera
      POSTGRES_DB: respondera
    ports:
      - "5432:5432"
    volumes:
      - respondera_pg_data:/var/lib/postgresql/data

volumes:
  respondera_pg_data:
